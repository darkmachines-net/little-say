# Uses the common toolkit pin to build a development client and matching preview from the selected Source.
name: Development
on:
  workflow_dispatch:
    inputs:
      operation: { description: 'Build a dev client with a preview, or update an existing client', type: choice, options: [build, update], default: build, required: true }
      platform: { description: Phone platform, type: choice, options: [android, ios], default: android, required: true }
      source: { description: App source branch or full commit SHA; blank uses master, type: string, default: '' }
permissions: { contents: read }
jobs:
  development:
    uses: darkmachines-net/expo-release-template/.github/workflows/development.yml@bd35cac92487667ecd5ecdc1f72d3fecee350faa
    with: { operation: '${{ inputs.operation }}', platform: '${{ inputs.platform }}', source: '${{ inputs.source }}' }
    secrets: inherit
