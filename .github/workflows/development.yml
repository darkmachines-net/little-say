# Run the trusted workflow from master; Source selects the branch or commit for the development app.
name: Development
on:
  workflow_dispatch:
    inputs:
      operation: { description: Build a dev client or publish a hosted preview, type: choice, options: [build, update], default: build, required: true }
      platform: { description: Phone platform, type: choice, options: [android, ios], default: android, required: true }
      source: { description: App source branch or full commit SHA; blank uses master, type: string, default: '' }
permissions: { contents: read }
jobs:
  development:
    uses: darkmachines-net/expo-release-template/.github/workflows/development.yml@44f6e1466cabf5f8a80378701307472f4414a3fd
    with: { operation: '${{ inputs.operation }}', platform: '${{ inputs.platform }}', source: '${{ inputs.source }}' }
    secrets: inherit
