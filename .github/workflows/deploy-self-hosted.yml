# Calls the shared authenticated deployment webhook over WireGuard and waits for its readiness result.
name: Deploy self-hosted server
run-name: Deploy little-say server (${{ inputs.request_id || github.run_id }})
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional correlation ID used by the local OTA command
        type: string
        required: false
  workflow_call:
    secrets:
      DEPLOY_WG_ENDPOINT:
        required: true
      DEPLOY_WG_PRIVATE_KEY:
        required: true
      DEPLOY_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: self-hosted-testing
    # One dedicated little-say CI peer; never interrupt an in-progress upgrade.
    concurrency:
      group: little-say-self-hosted-deploy
      cancel-in-progress: false
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install WireGuard tools if missing
        run: |
          set -euo pipefail
          if ! command -v wg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wireguard-tools
          fi
      - name: Call shared deployment webhook and wait for readiness
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_WG_ADDRESS: ${{ vars.DEPLOY_WG_ADDRESS }}
          DEPLOY_WG_PUBLIC_KEY: ${{ vars.DEPLOY_WG_PUBLIC_KEY }}
          DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
          DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: node deploy/scripts/connect-and-deploy.mjs
      - name: Remove tunnel after cancellation or failure
        if: always()
        run: |
          if sudo ip link show little-say-ci >/dev/null 2>&1; then
            sudo ip link delete little-say-ci
          fi
