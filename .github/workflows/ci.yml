# Checks code and isolated services/browser flows, retaining current editor and navigation screenshots as temporary evidence.
name: Check
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:services
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web -- tests/web/safe-area.spec.ts
      - name: Validate board navigation in Chromium
        id: board_navigation
        run: npm run test:web -- tests/web/editor-transition.spec.ts
      - name: Retain board navigation screenshots for review
        if: ${{ !cancelled() && steps.board_navigation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board-navigation-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/screenshots/board-navigation/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Validate Settings in Chromium
        id: settings
        run: npm run test:web -- tests/web/settings.spec.ts
      - name: Retain Settings screenshots for review
        if: ${{ !cancelled() && steps.settings.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/screenshots/settings/*.png
          if-no-files-found: warn
          retention-days: 14
      - run: npm run test:accounts:web
      - name: Conversation end-to-end checks
        id: conversation
        run: npm run test:web -- tests/web/conversation.spec.ts
      - name: Retain conversation screenshots for review
        if: ${{ !cancelled() && steps.conversation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conversation-screenshots
          path: |
            artifacts/screenshots/unified-editor-*.png
            artifacts/screenshots/editor-typing-*.png
          if-no-files-found: error
          retention-days: 7
