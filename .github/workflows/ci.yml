# Validates release metadata, types, unit tests, and production builds for source changes.
name: Check
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: little_say_test
          POSTGRES_PASSWORD: little_say_test
          POSTGRES_DB: little_say_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U little_say_test -d little_say_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_PGDATABASE: little_say_test
      TEST_PGUSER: little_say_test
      TEST_PGPASSWORD: little_say_test
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

      - run: npm run test:services
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --only auth --project demo-little-say "npm run test:web"
