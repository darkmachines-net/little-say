# Records an unprivileged request; trusted shared workers verify its original default-branch run.
name: Release request
on:
  workflow_dispatch:
    inputs:
      request: { description: 'Versioned release request from npm run release', type: string, required: true }
permissions: { contents: read }
jobs:
  request:
    uses: MChartier/expo-release-template/.github/workflows/release-request.yml@1303156faa526fc5c51b8863c56a7c25bf00ab3e
    with: { request: '${{ inputs.request }}' }
