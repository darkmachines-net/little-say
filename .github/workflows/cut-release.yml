# Explicitly plans, prepares, publishes, and recovers selective or forced Little Say releases.
name: Cut release
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run source checks with disposable services only (no release operations)
        type: boolean
        default: false
      ios_pods_only:
        description: Only compare iOS pod installation (also requires validation_only)
        type: boolean
        default: false
      ios_pods_head:
        description: Reviewed full source SHA required for iOS pod validation
        type: string
      ios_pods_baseline:
        description: Full baseline SHA required for iOS pod validation
        type: string
      build_mode:
        description: Detect changed artifacts or force a fresh complete release
        type: choice
        options: [auto, force_all]
        default: auto
        required: true
      bump:
        description: Server version increment (applied only when publishing a new image)
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      profile:
        description: Native distribution profile and OTA channel
        type: choice
        options: [internal, production]
        default: internal
        required: true
      dry_run:
        description: Validate and export without preparing versions or publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ (inputs.validation_only || inputs.ios_pods_only) && format('little-say-validation-{0}', github.ref) || 'little-say-release' }}
  cancel-in-progress: false
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_MODE: ${{ inputs.build_mode }}
  RELEASE_PROFILE: ${{ inputs.profile }}
  RELEASE_BUMP: ${{ inputs.bump }}
  RELEASE_DRY_RUN: ${{ inputs.dry_run }}
  EXPO_NO_DOTENV: '1'
  TEST_PGDATABASE: little_say_test
  TEST_PGUSER: little_say_test
  TEST_PGPASSWORD: little_say_test
jobs:
  ios-pods:
    if: inputs.ios_pods_only
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      EXPECTED_HEAD: ${{ inputs.ios_pods_head }}
      BASELINE_SHA: ${{ inputs.ios_pods_baseline }}
      VALIDATION_ONLY: ${{ inputs.validation_only }}
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      LITTLE_SAY_GOOGLE_IOS_URL_SCHEME: ''
      EXPO_NO_TELEMETRY: '1'
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - name: Require reviewed immutable sources and validation mode
        shell: bash
        run: |
          set -euo pipefail
          test "$VALIDATION_ONLY" = true
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASELINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$BASELINE_SHA" != "$EXPECTED_HEAD"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: fix
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ios_pods_baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.3.12'
      - name: Install the diagnostic CocoaPods version
        run: gem install cocoapods --version 1.16.2 --no-document
      - name: Reproduce baseline without Google OAuth configuration
        id: baseline
        continue-on-error: true
        run: node fix/scripts/release/ios-pods-check.mjs baseline "$BASELINE_SHA" baseline evidence/baseline
      - name: Validate fix without Google OAuth configuration
        id: fix
        if: ${{ !cancelled() && steps.baseline.outcome != 'skipped' }}
        run: node fix/scripts/release/ios-pods-check.mjs fix "$EXPECTED_HEAD" fix evidence/fix
      - name: Retain exact inputs, generated pod files and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-pods-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Require both the diagnosed baseline and passing fix
        if: ${{ !cancelled() && always() }}
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
        run: test "$BASELINE_OUTCOME" = success && test "$FIX_OUTCOME" = success
  validate:
    if: inputs.validation_only && !inputs.ios_pods_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: little_say_test
          POSTGRES_PASSWORD: little_say_test
          POSTGRES_DB: little_say_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U little_say_test -d little_say_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate exact source with disposable PostgreSQL and demo Auth
        run: npm run release:validate
  prepare:
    if: ${{ !inputs.validation_only && !inputs.ios_pods_only && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: write
      checks: write
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: little_say_test
          POSTGRES_PASSWORD: little_say_test
          POSTGRES_DB: little_say_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U little_say_test -d little_say_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    outputs:
      active: ${{ steps.cut.outputs.active }}
      commit: ${{ steps.cut.outputs.commit }}
      server: ${{ steps.cut.outputs.server }}
      native: ${{ steps.cut.outputs.native }}
      ota: ${{ steps.cut.outputs.ota }}
      profile: ${{ steps.cut.outputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Plan, validate, and prepare the release
        id: cut
        run: npm run release:cut -- prepare
  server:
    env:
      GH_TOKEN: ${{ github.token }}
    needs: prepare
    if: ${{ !inputs.validation_only && !inputs.ios_pods_only && (needs.prepare.outputs.active == 'true' && needs.prepare.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: npm run release:cut -- server
  native:
    needs: prepare
    if: ${{ !inputs.validation_only && !inputs.ios_pods_only && (needs.prepare.outputs.active == 'true' && needs.prepare.outputs.native != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.native) }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - run: npm run release:cut -- native
  submit:
    needs: [prepare, server, native]
    if: ${{ !inputs.validation_only && !inputs.ios_pods_only && (always() && !cancelled() && needs.prepare.outputs.active == 'true' && needs.prepare.outputs.profile == 'production' && needs.native.result == 'success' && (needs.server.result == 'success' || needs.server.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.native) }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - run: npm run release:cut -- submit
  ota:
    needs: [prepare, server, native, submit]
    if: ${{ !inputs.validation_only && !inputs.ios_pods_only && (always() && !cancelled() && needs.prepare.outputs.active == 'true' && needs.prepare.outputs.ota == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped') && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.submit.result == 'success' || needs.submit.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - run: npm run release:cut -- ota
  finalize:
    needs: [prepare, server, native, submit, ota]
    if: ${{ !inputs.validation_only && !inputs.ios_pods_only && (always() && !cancelled() && needs.prepare.outputs.active == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped') && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.submit.result == 'success' || needs.submit.result == 'skipped') && (needs.ota.result == 'success' || needs.ota.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: npm run release:cut -- finalize
