# Selects and publishes releases, gates OTA on the shared server deployment webhook, and preserves retryable journals.
name: Cut release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for server and native releases when needed
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      profile:
        description: Native distribution channel
        type: choice
        options: [internal, production]
        default: internal
        required: true
permissions:
  contents: read
concurrency:
  group: little-say-release
  cancel-in-progress: false
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_PROFILE: ${{ inputs.profile }}
  RELEASE_BUMP: ${{ inputs.bump }}
  EXPO_NO_DOTENV: '1'
  TEST_PGDATABASE: little_say_test
  TEST_PGUSER: little_say_test
  TEST_PGPASSWORD: little_say_test
jobs:
  prepare:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: write
      checks: write
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: little_say_test
          POSTGRES_PASSWORD: little_say_test
          POSTGRES_DB: little_say_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U little_say_test -d little_say_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    outputs:
      active: ${{ steps.cut.outputs.active }}
      commit: ${{ steps.cut.outputs.commit }}
      server: ${{ steps.cut.outputs.server }}
      native: ${{ steps.cut.outputs.native }}
      ota: ${{ steps.cut.outputs.ota }}
      profile: ${{ steps.cut.outputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Plan, validate, and prepare the release
        id: cut
        run: npm run release:cut -- prepare
  server:
    env:
      GH_TOKEN: ${{ github.token }}
    needs: prepare
    if: ${{ needs.prepare.outputs.active == 'true' && needs.prepare.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: npm run release:cut -- server
  promote-server:
    needs: [prepare, server]
    if: ${{ needs.prepare.outputs.active == 'true' && needs.prepare.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: npm run release:cut -- promote-server
  deploy:
    needs: [prepare, server, promote-server]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.active == 'true' && (needs.prepare.outputs.server == 'true' || needs.prepare.outputs.ota == 'true') && (needs.server.result == 'success' || needs.server.result == 'skipped') && (needs.promote-server.result == 'success' || needs.promote-server.result == 'skipped') }}
    uses: ./.github/workflows/deploy-self-hosted.yml
    permissions:
      contents: read
    secrets:
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  native:
    needs: prepare
    if: ${{ needs.prepare.outputs.active == 'true' && needs.prepare.outputs.native != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.native) }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - run: npm run release:cut -- native
  submit:
    needs: [prepare, server, native]
    if: ${{ always() && !cancelled() && needs.prepare.outputs.active == 'true' && needs.prepare.outputs.profile == 'production' && needs.native.result == 'success' && (needs.server.result == 'success' || needs.server.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.native) }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - run: npm run release:cut -- submit
  ota:
    needs: [prepare, server, deploy, native, submit]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.active == 'true' && needs.prepare.outputs.ota == 'true' && needs.deploy.result == 'success' && (needs.server.result == 'success' || needs.server.result == 'skipped') && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.submit.result == 'success' || needs.submit.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - run: npm run release:cut -- ota
  finalize:
    needs: [prepare, server, deploy, native, submit, ota]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.active == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped') && (needs.deploy.result == 'success' || (needs.prepare.outputs.server != 'true' && needs.prepare.outputs.ota != 'true' && needs.deploy.result == 'skipped')) && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.submit.result == 'success' || needs.submit.result == 'skipped') && (needs.ota.result == 'success' || needs.ota.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: npm run release:cut -- finalize
