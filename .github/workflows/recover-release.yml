# Records explicit recovery intent; inspection remains a read-only CLI operation.
name: Recover release
on:
  workflow_dispatch:
    inputs:
      request: { description: 'Versioned recovery request from npm run release', type: string, required: true }
permissions: { contents: read }
jobs:
  request:
    uses: MChartier/expo-release-template/.github/workflows/release-request.yml@1303156faa526fc5c51b8863c56a7c25bf00ab3e
    with: { request: '${{ inputs.request }}' }
