# Audits a terminal fully published internal cut and optionally publishes only its missing completion receipt.
name: Recover release completion
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original failed Cut release run ID
        required: true
        type: string
      apply:
        description: Publish the completion receipt after all readbacks pass
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: little-say-release
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RECOVERY_RUN_ID: ${{ inputs.run_id }}
      RECOVERY_APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eas-cli
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: npx tsx scripts/release/completion-recovery.ts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
