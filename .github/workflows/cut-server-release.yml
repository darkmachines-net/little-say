# Cuts a version-only server release, then publishes and verifies its multi-architecture GHCR image.
name: Cut server release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Server version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
permissions:
  contents: read
concurrency:
  group: cut-server-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    outputs:
      commit: ${{ steps.cut.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate, create version PR, and merge when permitted
        id: cut
        # npm supplies npm_execpath so nested validation resolves npm on the Ubuntu runner.
        run: npm run release:cut
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUMP: ${{ inputs.bump }}
  publish:
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate release SHA before checkout
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: '[[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Require merged source before executing repository code
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate release and immutable tags
        id: release
        run: node --import tsx scripts/release/server-publish.ts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        if: steps.release.outputs.exists != 'true'
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:v${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ needs.prepare.outputs.commit }}
            ${{ steps.release.outputs.latest == 'true' && format('{0}:latest', steps.release.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Read back publication
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest || steps.release.outputs.digest }}
        run: |
          test -n "$DIGEST"
          for tag in "v$VERSION" "sha-$RELEASE_COMMIT"; do
            docker buildx imagetools inspect "$IMAGE:$tag" | grep -F "$DIGEST"
          done
          printf 'Published %s@%s (server %s).\n\nDeployment is a separate local command.\n' "$IMAGE" "$DIGEST" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
