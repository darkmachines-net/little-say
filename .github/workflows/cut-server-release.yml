# Cuts a version-only server release from the default branch, then invokes image publication.
name: Cut server release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Server version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
permissions:
  contents: read
concurrency:
  group: cut-server-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    outputs:
      commit: ${{ steps.cut.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate, create version PR, and merge when permitted
        id: cut
        # npm supplies npm_execpath so nested validation resolves npm on the Ubuntu runner.
        run: npm run release:cut
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUMP: ${{ inputs.bump }}
  publish:
    needs: prepare
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-server-image.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
