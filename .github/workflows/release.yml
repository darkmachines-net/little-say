# Store releases use the pinned workflow's confirmed-submission reuse from the protected default branch.
name: Release
on:
  workflow_dispatch:
    inputs:
      profile: { description: 'beta: testers; production: public channel and store draft', type: choice, required: true, options: [beta, production], default: beta }
      rebuild: { description: Force a new native build, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@44f6e1466cabf5f8a80378701307472f4414a3fd
    with: { profile: '${{ inputs.profile }}', rebuild: '${{ inputs.rebuild }}' }
    secrets: inherit
