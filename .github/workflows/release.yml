# Store-testing and production releases use one immutable shared workflow from the protected default branch.
name: Release
on:
  workflow_dispatch:
    inputs:
      profile: { description: 'internal: Play testing + TestFlight; production: configured store submission', type: choice, required: true, options: [internal, production] }
      rebuild: { description: Build compatible binaries and same-runtime OTA, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@e89e7ba19cff04b828558d7acad75663ffb46a06
    with: { profile: '${{ inputs.profile }}', rebuild: '${{ inputs.rebuild }}' }
    secrets: inherit
