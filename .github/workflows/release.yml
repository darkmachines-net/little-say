# Delegates coordinated GCP/Expo delivery to the same pinned toolkit used by development and app startup.
name: Release
run-name: ${{ inputs.destination == 'production' && 'Deploy to production (GCP + Expo beta)' || 'Public-store release (Expo production)' }}
on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'production: GCP + Expo beta (TestFlight/Play internal); public-stores: production channel and store draft'
        type: choice
        required: true
        options: [production, public-stores]
        default: production
      rebuild: { description: Force a new native build, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write, id-token: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@81715f8c46676020a3348d3db5584c8bce676bd0
    with:
      profile: ${{ fromJSON('{"production":"beta","public-stores":"production"}')[inputs.destination] }}
      rebuild: ${{ inputs.rebuild }}
    secrets: inherit
