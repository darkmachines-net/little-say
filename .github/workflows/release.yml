# Protected releases federate GCP deployment before native/OTA delivery and reuse confirmed toolkit operations.
name: Release
on:
  workflow_dispatch:
    inputs:
      profile: { description: 'beta: testers; production: public channel and store draft', type: choice, required: true, options: [beta, production], default: beta }
      rebuild: { description: Force a new native build, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write, id-token: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@cf95c38552aa1ed8877952c2002f40f5c65ac88f
    with: { profile: '${{ inputs.profile }}', rebuild: '${{ inputs.rebuild }}' }
    secrets: inherit
