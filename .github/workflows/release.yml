# Prepares changed Dev clients and development OTA on master, gates beta promotion, then delegates GCP/Expo delivery.
name: Release
run-name: ${{ inputs.destination == 'public-stores' && 'Public-store release (Expo production)' || 'Continuous delivery (Development → approval → beta)' }}
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      destination:
        description: 'production: GCP + Expo beta (TestFlight/Play internal); public-stores: production channel and store draft'
        type: choice
        required: true
        options: [production, public-stores]
        default: production
      rebuild: { description: Force a new native build, type: boolean, default: false }
permissions: { contents: read }
jobs:
  release:
    permissions: { contents: write, deployments: write, packages: write, id-token: write }
    uses: darkmachines-net/expo-release-template/.github/workflows/release.yml@8f726274c94010aabbc759d774c2ddd26a8c6c2b
    with:
      profile: ${{ fromJSON('{"production":"beta","public-stores":"production"}')[inputs.destination || 'production'] }}
      rebuild: ${{ inputs.rebuild || false }}
    secrets: inherit
