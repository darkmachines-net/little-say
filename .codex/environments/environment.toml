# Starts isolated worktree stacks with Expo Go, the installed development client, or web; commands run from the repository root.
version = 1
name = "Little Say development"

[setup]
script = ""

[[actions]]
name = "Dev client + local backend"
icon = "run"
command = "node --import tsx scripts/dev.ts --local --dev-client"

[[actions]]
name = "Dev client + self-hosted backend"
icon = "run"
command = "node --import tsx scripts/dev.ts --remote --dev-client"

[[actions]]
name = "Expo + local backend"
icon = "run"
command = "node --import tsx scripts/dev.ts --local"

[[actions]]
name = "Expo + self-hosted backend"
icon = "run"
command = "node --import tsx scripts/dev.ts --remote"

[[actions]]
name = "Web + local backend"
icon = "run"
command = "node --import tsx scripts/dev.ts --local --web"

[[actions]]
name = "Web + self-hosted backend"
icon = "run"
command = "node --import tsx scripts/dev.ts --remote --web"
