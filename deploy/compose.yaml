# Runs a published server image with external configuration and persistent speech/picture caches.
# Used only by the local server:deploy command. No source build runs on the host.
services:
  little-say:
    image: ${LITTLE_SAY_SERVER_IMAGE:?An immutable image digest is required}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    env_file:
      - ${LITTLE_SAY_SERVER_ENV_FILE:?An external server environment file is required}
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      SPEECH_CACHE_DIR: /app/data/speech
      PICTURE_CACHE_DIR: /app/data/pictures
    read_only: true
    volumes:
      - speech-cache:/app/data/speech
      - picture-cache:/app/data/pictures
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  speech-cache:
  picture-cache:
