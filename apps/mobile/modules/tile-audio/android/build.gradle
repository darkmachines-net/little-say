// Builds the local Android tile player against the same Media3 version as expo-audio.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.darkmachines.littlesay.audio'
version = '1.0.0'

android {
  namespace 'net.darkmachines.littlesay.audio'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.media3:media3-exoplayer:1.9.1'
}
